    <!-- Só o subset latin das duas famílias. Precarregar os 5 arquivos gastaria
         banda com latin-ext e vietnamese, que o unicode-range nem chega a pedir
         numa tela em português. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/instrument-sans-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/bricolage-grotesque-latin.woff2" />
    <!-- Anti-flash do tema escuro: antes do primeiro paint, se o profissional salvou
         modo escuro, pinta os neutros essenciais do padrão (Rota escura) na raiz.
         O ThemeApplier completa a paleta certa logo depois. Evita o "flash branco". -->
    <script type="text/javascript">
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("pi-tema") || "{}");
          var modo = t.modo || "claro";
          var dark =
            modo === "escuro" ||
            (modo === "sistema" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (!dark) return;
          var r = document.documentElement;
          r.setAttribute("data-theme", "escuro");
          var v = {
            "--bg": "#0A0D14", "--bg-rgb": "10 13 20",
            "--surface": "#0D1524", "--surface-rgb": "13 21 36",
            "--surface-soft": "#1A2537", "--surface-soft-rgb": "26 37 55",
            "--surface-mute": "#232F45", "--surface-mute-rgb": "35 47 69",
            "--border": "#2A3648", "--border-rgb": "42 54 72",
            "--ink": "#F2F6FC", "--ink-rgb": "242 246 252",
            "--ink-2": "#9DB2D6", "--ink-2-rgb": "157 178 214",
            "--ink-3": "#9DB2D6", "--ink-3-rgb": "157 178 214",
            "--primary": "#7FA3EF", "--primary-rgb": "127 163 239"
          };
          for (var k in v) r.style.setProperty(k, v[k]);
        } catch (e) {}
      })();
    </script>
    <style>
      /* 363 é o comprimento medido do caminho da rota, por isso o traço fecha no último nó.
         O dasharray vive só aqui: sem animação o pino aparece inteiro, nunca tracejado. */
      .splash-marca {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--bg, #f7f6f3);
      }
      .splash-marca svg { width: 72px; height: 72px; }
      @keyframes splash-percorre { from { stroke-dashoffset: 363; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: no-preference) {
        .splash-marca .rota {
          stroke-dasharray: 363;
          animation: splash-percorre 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
      }
    </style>

    <!--
      A MARCA ENQUANTO O APLICATIVO CARREGA.

      Fica DENTRO de #root: o React limpa o contêiner no primeiro render, então não existe
      código de remoção para esquecer de rodar nem risco de a tela ficar presa. Enquanto o
      pacote não chega, o que aparece é a marca se desenhando, e não uma página em branco.

      O SVG é o mesmo de /brand/marca-pino.svg, embutido porque uma requisição a mais aqui
      atrasaria justamente o quadro que ele existe para preencher. Se a marca mudar, rode
      `node scripts/gerar-icones-marca.mjs` e traga o path novo para cá.
    -->
    <div id="root">
      <div class="splash-marca" role="status" aria-label="Carregando">
        <svg viewBox="0 0 512 512" fill="none" aria-hidden="true" focusable="false">
