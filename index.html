    <title>Mapa da Prescrição | Registrar, acompanhar e direcionar a prescrição</title>
    <!-- Só o subset latin das duas famílias. Precarregar os 5 arquivos gastaria
         banda com latin-ext e vietnamese, que o unicode-range nem chega a pedir
         numa tela em português. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/instrument-sans-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/bricolage-grotesque-latin.woff2" />
    <!-- Anti-flash do tema escuro: antes do primeiro paint, se o profissional salvou
         modo escuro, pinta os neutros essenciais do padrão (Rota escura) na raiz.
         O ThemeApplier completa a paleta certa logo depois. Evita o "flash branco". -->
    <script type="text/javascript">
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("pi-tema") || "{}");
          var modo = t.modo || "claro";
          var dark =
            modo === "escuro" ||
            (modo === "sistema" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (!dark) return;
          var r = document.documentElement;
          r.setAttribute("data-theme", "escuro");
          var v = {
            "--bg": "#0A0D14", "--bg-rgb": "10 13 20",
            "--surface": "#0D1524", "--surface-rgb": "13 21 36",
            "--surface-soft": "#1A2537", "--surface-soft-rgb": "26 37 55",
            "--surface-mute": "#232F45", "--surface-mute-rgb": "35 47 69",
            "--border": "#2A3648", "--border-rgb": "42 54 72",
            "--ink": "#F2F6FC", "--ink-rgb": "242 246 252",
            "--ink-2": "#9DB2D6", "--ink-2-rgb": "157 178 214",
            "--ink-3": "#9DB2D6", "--ink-3-rgb": "157 178 214",
            "--primary": "#7FA3EF", "--primary-rgb": "127 163 239"
          };
          for (var k in v) r.style.setProperty(k, v[k]);
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Sistema para profissionais de Educação Física: registre o aluno, a avaliação, o semáforo e o treino; acompanhe do cadastro à reavaliação; e direcione a prescrição ao objetivo e à condição de cada aluno, com o porquê documentado. A decisão é sempre sua."
    />
